name: Đề xuất tính năng
description: Ý tưởng giúp việc học hiệu quả hơn
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề bạn đang gặp
      description: Mô tả tình huống thật khi học, đừng mô tả giải pháp vội.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Bạn muốn ứng dụng làm gì
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Cách khác đã cân nhắc
