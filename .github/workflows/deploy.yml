name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One-time repo setup: Settings → Pages → Source → "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a cancelled deploy would leave the site on the older build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm run build` typechecks and validates content first, so a broken
      # lesson can never reach the live site.
      #
      # A per-person fork gets its own progress in the ONE shared database by
      # setting a single Actions *variable*, VITE_SYNC_ROW_ID, to its own UUID
      # (Settings → Secrets and variables → Actions → Variables). No source
      # edit, identical code across every fork. Unset → empty string → the app
      # falls back to the committed default UUID, so the main deployment keeps
      # building exactly as before.
      #
      # Only the row id is forwarded on purpose: every fork points at the same
      # Supabase project, so the URL and key stay as the committed defaults. An
      # empty VITE_SUPABASE_URL means "sync off" (that is how dev disables it),
      # so forwarding it unset would silently kill sync on every fork.
      #
      # VITE_LEARNER scopes content: a fork that sets it to its learner id shows
      # the shared lessons plus that learner's private ones. Unset (the admin
      # build) shows every lesson.
      - name: Build
        run: npm run build
        env:
          VITE_SYNC_ROW_ID: ${{ vars.VITE_SYNC_ROW_ID }}
          VITE_LEARNER: ${{ vars.VITE_LEARNER }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
