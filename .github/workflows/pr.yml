name: PR housekeeping

# Two triggers on purpose.
#
# `pull_request_target` runs in the base-repo context with a write token, which
# is what labelling needs — and it is only safe because that job never checks
# out the pull request's code.
#
# The content guard does check out PR content, so it runs under plain
# `pull_request` with a read-only token. Checking out untrusted code under
# `pull_request_target` is the classic way to hand a fork a write token.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request:
    paths: ['content/lessons/**']

permissions:
  contents: read

jobs:
  label:
    name: Label by changed paths
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  # The one rule no linter can catch: changing a lesson id, or renaming or
  # deleting a word, orphans the matching progress records and wipes that
  # history on every device the learner uses.
  content-guard:
    name: Warn on breaking content changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare lesson ids and words against the base
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          breaking=""

          for file in $(git diff --name-only "$BASE_SHA" -- 'content/lessons/*.json'); do
            [ -f "$file" ] || continue
            old=$(git show "$BASE_SHA:$file" 2>/dev/null || true)
            [ -n "$old" ] || continue

            # Data only: the PR's JSON is parsed, never executed, and this
            # script comes from the base checkout rather than the PR.
            report=$(OLD="$old" NEW_FILE="$file" node -e '
              const fs = require("fs");
              let before, after;
              try {
                before = JSON.parse(process.env.OLD);
                after = JSON.parse(fs.readFileSync(process.env.NEW_FILE, "utf8"));
              } catch { process.exit(0); }

              const out = [];
              if (before.id !== after.id) {
                out.push("id đổi từ `" + before.id + "` thành `" + after.id + "`");
              }
              const had = (before.words ?? []).map((w) => w.word);
              const has = new Set((after.words ?? []).map((w) => w.word));
              const gone = had.filter((w) => !has.has(w));
              if (gone.length) {
                out.push("từ bị xoá hoặc đổi tên: " + gone.map((w) => "`" + w + "`").join(", "));
              }
              console.log(out.join("\n"));
            ')

            if [ -n "$report" ]; then
              breaking="${breaking}"$'\n'"- **${file}**"$'\n'"$(echo "$report" | sed 's/^/  - /')"
            fi
          done

          if [ -n "$breaking" ]; then
            {
              echo "## ⚠️ Thay đổi này làm mất tiến độ đã lưu"
              echo
              echo 'Khóa tiến độ có dạng `<lessonId>:<word-slug>`. Đổi `id` bài học hoặc đổi'
              echo 'tên/xoá một `word` sẽ khiến bản ghi tiến độ tương ứng mồ côi và bị loại bỏ'
              echo 'trên **mọi thiết bị** của người học ở lần mở app tiếp theo.'
              echo "$breaking"
              echo
              echo 'Nếu đây là cố ý, ghi rõ lý do trong phần mô tả PR rồi merge bình thường.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Phát hiện thay đổi phá vỡ tiến độ — xem phần Summary của job này."
          else
            echo "## ✅ Nội dung tương thích ngược" >> "$GITHUB_STEP_SUMMARY"
            echo "Không có `id` bài học hay `word` nào bị đổi tên hoặc xoá." >> "$GITHUB_STEP_SUMMARY"
            echo "Không có thay đổi nào phá vỡ tiến độ."
          fi
