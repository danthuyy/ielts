<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>IELTS Vocab Trainer</title>
    <meta name="description" content="Ứng dụng học từ vựng IELTS, hoạt động cả khi offline" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IELTS Vocab" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before the stylesheet paints, so a light-theme user never sees a
      // flash of the dark palette. main.tsx re-applies this properly on boot;
      // this copy only has to be fast and never throw.
      (function () {
        try {
          var raw = localStorage.getItem('ielts_setting_theme');
          var choice = raw ? JSON.parse(raw) : 'system';
          if (choice !== 'light' && choice !== 'dark') {
            choice = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = choice;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', choice === 'light' ? '#f6f5fb' : '#0a0a1a');
        } catch (err) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ứng dụng cần JavaScript để chạy.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
